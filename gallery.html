<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Kanchi Farm Stay</title>
    <meta name="description" content="Explore photos of Kanchi Farm Stay — lush surroundings, rustic villas, farm animals, dining, camping and more. A nature retreat near Kanchipuram, Tamil Nadu.">
    <link rel="canonical" href="https://kanchifarmstay.com/gallery.html">
    <!-- Open Graph -->
    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="Kanchi Farm Stay">
    <meta property="og:title"       content="Gallery | Kanchi Farm Stay">
    <meta property="og:description" content="Explore photos of Kanchi Farm Stay — lush surroundings, rustic villas, farm animals, dining, camping and more.">
    <meta property="og:url"         content="https://kanchifarmstay.com/gallery.html">
    <meta property="og:image"       content="https://kanchifarmstay.com/assets/images/farm-hero.jpg">
    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="Gallery | Kanchi Farm Stay">
    <meta name="twitter:description" content="See what awaits at Kanchi Farm Stay — villas, farm life, dining, and nature.">
    <meta name="twitter:image"       content="https://kanchifarmstay.com/assets/images/farm-hero.jpg">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <div class="gallery-page">
        <section class="section bg-light text-center">
            <div class="container">
                <h1>Photo Gallery</h1>
                <p>A glimpse into the serene life at Kanchi Farm Stay</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <!-- Filter Buttons -->
                <div class="gallery-filters">
                    <button class="gallery-filter-btn active" data-filter="all" onclick="renderGalleryGrid('all')">All</button>
                    <button class="gallery-filter-btn" data-filter="accommodations" onclick="renderGalleryGrid('accommodations')">Accommodations</button>
                    <button class="gallery-filter-btn" data-filter="animals" onclick="renderGalleryGrid('animals')">Farm Animals</button>
                    <button class="gallery-filter-btn" data-filter="farm-life" onclick="renderGalleryGrid('farm-life')">Farm Life</button>
                    <button class="gallery-filter-btn" data-filter="facilities" onclick="renderGalleryGrid('facilities')">Facilities</button>
                </div>

                <!-- Gallery Grid (populated by JS) -->
                <div class="gallery-grid-page" id="gallery-grid"></div>
            </div>
        </section>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="script.js?v=5"></script>
</body>

</html>
